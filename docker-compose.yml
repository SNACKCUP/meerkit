# 대체용 DB입니다. 기본 DB는 Supabase 로컬이며 루트에서 `npm run db:start`로 켭니다.
# 이미지는 postgres:16으로 유지합니다. 기존 볼륨(pgdata)이 16 형식이라 17로 바꾸면 기존 데이터로 시작하지 못합니다.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: starter
      POSTGRES_PASSWORD: starter
      POSTGRES_DB: starter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 로컬 가짜 메일함. 실제로는 아무 데도 보내지 않습니다.
  # backend/.env 에 MAIL_BACKEND=smtp, MAIL_SMTP_HOST=localhost, MAIL_SMTP_PORT=1025 → 받은 메일은 http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025" # 웹 화면
      - "1025:1025" # SMTP

volumes:
  pgdata:
