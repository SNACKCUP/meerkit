# 대체용 DB입니다. 기본 DB는 Supabase 로컬이며 루트에서 `npm run db:start`로 켭니다.
# 이미지는 postgres:16으로 유지합니다. 기존 볼륨(pgdata)이 16 형식이라 17로 바꾸면 기존 데이터로 시작하지 못합니다.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: starter
      POSTGRES_PASSWORD: starter
      POSTGRES_DB: starter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # `docker compose up --wait`가 DB가 진짜 준비될 때까지 기다리게 한다. 처음 만들 때 DB는 초기화 중에 한 번 재시작하므로,
    # 헬스체크가 없으면 바로 이어지는 마이그레이션이 연결 오류로 실패한다. 초기화용 임시 서버는 TCP를 열지 않아서 -h 127.0.0.1 로 확인한다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U starter -d starter"]
      interval: 2s
      timeout: 3s
      retries: 30

  # 로컬 가짜 메일함. 실제로는 아무 데도 보내지 않습니다.
  # backend/.env 에 MAIL_BACKEND=smtp, MAIL_SMTP_HOST=localhost, MAIL_SMTP_PORT=1025 → 받은 메일은 http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025" # 웹 화면
      - "1025:1025" # SMTP

volumes:
  pgdata:
