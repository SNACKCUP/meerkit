# 로컬 DB입니다. meerkit CLI(`setup`·`start`)와 `docker compose up -d db`가 이 DB를 켭니다. Supabase CLI(`npm run db:start`)는 대체용입니다.
# 이미지는 운영(Supabase)·CI와 같은 PostgreSQL 17입니다.
# PostgreSQL 16 시절에 만든 볼륨(pgdata)이 남아 있으면 17이 그 데이터로 시작하지 못하고 바로 꺼집니다
# (`docker compose logs db`에 "database files are incompatible with server"). README의 "PostgreSQL 16에서 17로 옮기기"를 보세요.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: starter
      POSTGRES_PASSWORD: starter
      POSTGRES_DB: starter
    ports:
      # 호스트 포트는 DB_PORT로 바꿀 수 있다(기본 5432). meerkit CLI는 backend/.env의 DATABASE_URL 포트를 DB_PORT로 넘겨 주고, 직접 켤 때는 `DB_PORT=5433 docker compose up -d db`.
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # `docker compose up --wait`가 DB가 진짜 준비될 때까지 기다리게 한다. 처음 만들 때 DB는 초기화 중에 한 번 재시작하므로,
    # 헬스체크가 없으면 바로 이어지는 마이그레이션이 연결 오류로 실패한다. 초기화용 임시 서버는 TCP를 열지 않아서 -h 127.0.0.1 로 확인한다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U starter -d starter"]
      interval: 2s
      timeout: 3s
      retries: 30

  # 로컬 가짜 메일함. 실제로는 아무 데도 보내지 않습니다.
  # backend/.env 에 MAIL_BACKEND=smtp, MAIL_SMTP_HOST=localhost, MAIL_SMTP_PORT=1025 → 받은 메일은 http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025" # 웹 화면
      - "1025:1025" # SMTP

volumes:
  pgdata:
