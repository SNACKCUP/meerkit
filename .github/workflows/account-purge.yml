# 탈퇴 후 보관 기간(ACCOUNT_RETENTION_DAYS, 기본 365일)이 지난 계정의 개인정보를 지우고(app.users.purge),
# 이어서 인증 쪽 기록(app.auth.cleanup)과 소셜 계정 연결(app.social.cleanup)을 정리합니다.
# 매일 03:00(KST)에 실행하고, Actions 화면에서 직접 실행할 수도 있습니다 (dry_run으로 건수만 확인 가능).
#
# 준비 (저장소 Settings → Secrets and variables → Actions):
#   - Secret  DATABASE_URL            운영 DB 주소 (GitHub 러너에서 접속할 수 있어야 함)
#   - Variable ACCOUNT_RETENTION_DAYS  (선택) 기본 365
# DATABASE_URL이 없으면 아무것도 하지 않고 성공으로 끝납니다.
# DB가 외부에서 접속되지 않는 환경이면 이 워크플로 대신 서버 cron에서 같은 명령을 실행하세요:
#   cd backend && uv run python -m app.users.purge && uv run python -m app.auth.cleanup && uv run python -m app.social.cleanup
name: account-purge
on:
  schedule:
    - cron: "0 18 * * *" # UTC 18:00 = KST 03:00
  workflow_dispatch:
    inputs:
      dry_run:
        description: "처리하지 않고 대상 건수만 확인"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: account-purge
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # 이 작업은 토큰을 만들지 않지만 설정 로딩에 필요한 값이라 실행마다 임의 값을 넣습니다.
      JWT_SECRET_KEY: purge-job-${{ github.run_id }}-${{ github.run_attempt }}-unused
      ACCOUNT_RETENTION_DAYS: ${{ vars.ACCOUNT_RETENTION_DAYS || '365' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check DATABASE_URL secret
        id: guard
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret이 없어 건너뜁니다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@v6
        if: steps.guard.outputs.skip != 'true'
      - run: uv sync --locked --no-dev
        if: steps.guard.outputs.skip != 'true'
      - name: Purge expired accounts
        if: steps.guard.outputs.skip != 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            uv run python -m app.users.purge --dry-run
            uv run python -m app.auth.cleanup --dry-run
            uv run python -m app.social.cleanup --dry-run
          else
            uv run python -m app.users.purge
            # 회원 정리 다음에 인증 쪽 기록(탈퇴 회원의 재설정 토큰, 오래된 인증번호)을 정리합니다
            uv run python -m app.auth.cleanup
            # 개인정보를 지운 회원의 소셜 연결(공급자 이메일·이름) 삭제
            uv run python -m app.social.cleanup
          fi
